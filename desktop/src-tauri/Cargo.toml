[package]
name = "merge-forge"
version = "1.0.0"
description = "Three-pane merge conflict resolver for Fork"
authors = ["Merge Forge"]
edition = "2021"

[lib]
name = "merge_forge_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
